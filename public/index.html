<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #container {
      width: 400px;
      background-color: #ffffff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    #chat {
      background-color: #f1f1f1;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 5px;
      height: 150px;
      overflow-y: auto;
    }

    .label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    button {
      padding: 10px 15px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }
  </style>
</head>

<body>
  <div id="container">
    <!-- Chat History Section -->
    <div id="chat">Welcome to the chat!</div>

    <!-- User Registration Section -->
    <div class="form-group">
      <label class="label" for="username">Username:</label>
      <input id="username" type="text" placeholder="Enter your username">
      <button onclick="register()">Register</button>
    </div>

    <!-- Message Sending Section -->
    <div class="form-group">
      <label class="label" for="recipient">To:</label>
      <input id="recipient" type="text" placeholder="Recipient username">
    </div>
    <div class="form-group">
      <label class="label" for="message">Message:</label>
      <input id="message" type="text" placeholder="Type your message">
    </div>
    <button onclick="sendMessage()">Send</button>
  </div>


  <script>
    const socket = io("https://chatserver-zxbu.onrender.com");

    function register() {
      const username = document.getElementById("username").value;
      socket.emit("register", username);
      alert("Registered as " + username);
    }

    function sendMessage() {
      const recipient = document.getElementById("recipient").value;
      const message = document.getElementById("message").value;
      const sender = document.getElementById("username").value;
      socket.emit("private_message", { sender, recipient, message });
    }

    socket.on("private_message", ({ sender, message }) => {
      const chat = document.getElementById("chat");
      const messageElement = document.createElement("div");
      messageElement.textContent = `${sender}: ${message}`;
      chat.appendChild(messageElement);
    });

    socket.on("error", (errorMessage) => {
      alert(errorMessage);
    });
  </script>
</body>

</html>
